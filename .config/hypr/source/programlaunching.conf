# Program-launching keybinds
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, L, exec, rofi -show power-menu -modi power-menu:rofi-power-menu
bind = $mainMod, return, exec, [float; size 800 600; tile] $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, X, exec, firefox
bind = $mainMod, X, exec, run-or-raise firefox firefox
bind = $mainMod SHIFT, Z, exec, firefox -P school
bind = $mainMod, C, exec, run-or-raise VSCodium codium

